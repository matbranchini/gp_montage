name: Deploy website

# Controllo deploy su push:
# - aggiungi [deploy] nel messaggio commit => esegue il deploy
# - aggiungi [no-deploy] nel messaggio commit => salta il deploy
# Se nessuno dei due tag è presente, il deploy viene saltato.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[deploy]') && !contains(github.event.head_commit.message, '[no-deploy]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v6

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /sites/gpmontage.ch/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.vscode/**
