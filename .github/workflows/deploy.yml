name: Deploy website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v6

      - name: Esplora cartelle FTP
        run: |
          echo "=== /sites/ ==="
          curl -s --list-only "ftp://${{ secrets.FTP_SERVER }}/sites/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || echo "non esiste"
          echo "=== /sites/gpmontage.ch/ ==="
          curl -s --list-only "ftp://${{ secrets.FTP_SERVER }}/sites/gpmontage.ch/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || echo "non esiste"
          echo "=== /sites/www.gpmontage.ch/ ==="
          curl -s --list-only "ftp://${{ secrets.FTP_SERVER }}/sites/www.gpmontage.ch/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || echo "non esiste"
          echo "=== /httpdocs/ contenuto ==="
          curl -s --list-only "ftp://${{ secrets.FTP_SERVER }}/httpdocs/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || echo "non esiste"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.vscode/**
